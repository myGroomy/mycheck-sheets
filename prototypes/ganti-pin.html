<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ganti PIN — checklist-shift</title>
  <link rel="stylesheet" href="css/shared.css">
</head>
<body>
  <div class="app-shell" style="display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:var(--s3);">
    <div style="width:100%;max-width:360px;">
      <div style="text-align:center;margin-bottom:var(--s6);">
        <div style="width:56px;height:56px;background:var(--warning);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;margin:0 auto var(--s3);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <h1 style="font-size:var(--text-xl);font-weight:700;">Ganti PIN</h1>
        <p style="color:var(--ink-muted);font-size:var(--text-xs);margin-top:2px;">PIN awal harus diganti saat login pertama</p>
      </div>

      <div class="card">
        <div class="form-group">
          <label class="form-label">PIN Lama</label>
          <div class="pin-input">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">PIN Baru <span class="required">*</span></label>
          <div class="pin-input">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
          </div>
          <p class="form-hint">6 angka, hindari PIN lemah (123456, 000000)</p>
        </div>

        <div class="form-group">
          <label class="form-label">Konfirmasi PIN Baru <span class="required">*</span></label>
          <div class="pin-input">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-digit" maxlength="1" inputmode="numeric">
          </div>
        </div>

        <button class="btn btn-primary btn-block btn-lg">Simpan PIN Baru</button>
      </div>
    </div>
  </div>

  <script src="js/shared.js"></script>
</body>
</html>
