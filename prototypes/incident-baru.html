<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Buat Incident — checklist-shift</title>
  <link rel="stylesheet" href="css/shared.css">
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="header-inner">
        <div>
          <div class="header-title">Buat Incident</div>
          <div class="header-sub">Cabang BDG01 — Bandung</div>
        </div>
        <a href="incident.html" class="btn btn-ghost btn-sm">Batal</a>
      </div>
    </header>

    <main class="page-content no-bottom-pad">
      <div class="card" style="margin-bottom:var(--s3);">
        <div class="form-group">
          <label class="form-label">Kategori <span class="required">*</span></label>
          <div style="display:flex;flex-wrap:wrap;gap:var(--s1);">
            <button class="filter-chip active">Kerusakan peralatan</button>
            <button class="filter-chip">Menu basi</button>
            <button class="filter-chip">Kecelakaan kerja</button>
            <button class="filter-chip">Komplain</button>
            <button class="filter-chip">Keamanan</button>
            <button class="filter-chip">Lainnya</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Deskripsi <span class="required">*</span></label>
          <textarea class="form-textarea" placeholder="Jelaskan kejadian..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Foto (maks 5)</label>
          <div class="photo-upload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <div style="font-size:var(--text-xs);font-weight:500;">Tap untuk ambil foto</div>
            <div style="font-size:10px;margin-top:2px;">Foto akan dikompres otomatis</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Waktu Kejadian</label>
          <input type="datetime-local" class="form-input">
        </div>
      </div>

      <button class="btn btn-primary btn-block btn-lg">Kirim Incident</button>
    </main>
  </div>

  <script src="js/shared.js"></script>
</body>
</html>
