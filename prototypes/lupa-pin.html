<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lupa PIN — checklist-shift</title>
  <link rel="stylesheet" href="css/shared.css">
</head>
<body>
  <div class="app-shell" style="display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:var(--s3);">
    <div style="width:100%;max-width:400px;">
      <div style="text-align:center;margin-bottom:var(--s6);">
        <div style="width:56px;height:56px;background:var(--warning);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;margin:0 auto var(--s3);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <h1 style="font-size:var(--text-xl);font-weight:700;">Lupa PIN?</h1>
        <p style="color:var(--ink-muted);font-size:var(--text-xs);margin-top:var(--s1);">Hubungi admin untuk mereset PIN Anda</p>
      </div>

      <div class="card">
        <div style="text-align:center;padding:var(--s4) 0;">
          <div style="width:48px;height:48px;background:var(--canvas);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto var(--s3);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          </div>
          <div style="font-size:var(--text-sm);font-weight:500;margin-bottom:var(--s1);">Cara Reset PIN</div>
          <ol style="text-align:left;font-size:var(--text-xs);color:var(--ink-muted);padding-left:var(--s4);line-height:1.8;">
            <li>Hubungi admin cabang Anda</li>
            <li>Admin akan mereset PIN melalui halaman Akun</li>
            <li>Anda akan mendapat PIN baru sementara</li>
            <li>Login dengan PIN baru</li>
            <li>Segera ganti PIN di halaman Ganti PIN</li>
          </ol>
        </div>
      </div>

      <a href="login.html" class="btn btn-outline btn-block" style="margin-top:var(--s3);">Kembali ke Login</a>
    </div>
  </div>
  <script src="js/shared.js"></script>
</body>
</html>
